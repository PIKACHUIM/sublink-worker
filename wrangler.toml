#:schema node_modules/wrangler/config-schema.json
name = "sublinks-work"
main = "src/worker.jsx"
compatibility_date = "2024-07-24"
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "SUBLINK_KV", id = "953fcf4d7b8148fc88f438203bf863cf" }
]

[assets]
directory = "./public"

# Keep this table last: TOML puts every following bare key inside it.
[vars]
# Panel lives at /admin; ADMIN_USERNAME/ADMIN_PASSWORD are Worker secrets.
ADMIN_PATH = "admin"
